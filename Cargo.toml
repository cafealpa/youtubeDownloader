[package]
name = "youtube-downloader"
version = "2.0.0"
edition = "2021"
rust-version = "1.88"

[dependencies]
iced = { version = "=0.14.0", default-features = false, features = ["tiny-skia", "image-without-codecs", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
directories = "6"
url = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
sha2 = "0.10"
fs2 = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_Storage_FileSystem"] }

[profile.release]
strip = true
lto = "thin"
